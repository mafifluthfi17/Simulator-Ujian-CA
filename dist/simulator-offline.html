<title>Simulator Ujian CA (offline)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2218%22%20fill%3D%22%231d4ed8%22%2F%3E%3Crect%20x%3D%2227%22%20y%3D%2220%22%20width%3D%2246%22%20height%3D%2260%22%20rx%3D%225%22%20fill%3D%22%23ffffff%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%2229%22%20width%3D%2224%22%20height%3D%223.5%22%20rx%3D%221.7%22%20fill%3D%22%23c9d0da%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%2237%22%20width%3D%2232%22%20height%3D%223.5%22%20rx%3D%221.7%22%20fill%3D%22%23c9d0da%22%2F%3E%3Cpolyline%20points%3D%2237%2C60%2046%2C69%2065%2C48%22%20fill%3D%22none%22%20stroke%3D%22%23ea8a1a%22%20stroke-width%3D%226.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
/* Simulator Ujian CA — tampilan (SPEC 3): teks 16px, target sentuh >= 44px,
   kontras WCAG AA, mode gelap mengikuti sistem, dua warna aksen (biru, oranye). */

:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --text: #1b1f24;
  --muted: #555e6b;
  --border: #c9d0da;
  --accent: #1d4ed8;          /* aksen 1: aksi utama */
  --accent-text: #ffffff;
  --accent-soft: #dbe6ff;
  --warn: #b45309;            /* aksen 2: peringatan, tanda */
  --warn-soft: #fdecd3;
  --danger: #b91c1c;
  --ok: #166534;
  --radius: 10px;
  --tap: 44px;
  --shadow: 0 1px 3px rgba(0, 0, 0, .12);
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --surface: #1a1f26;
    --surface-2: #232a33;
    --text: #e8ebef;
    --muted: #a9b2bf;
    --border: #3a4350;
    --accent: #7aa2ff;
    --accent-text: #0b1020;
    --accent-soft: #23314f;
    --warn: #f0a24a;
    --warn-soft: #3a2a14;
    --danger: #ff8a8a;
    --ok: #6fd68f;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
/* Atribut hidden selalu menang atas display komponen (mis. .menu { display: grid }). */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; margin: 1.25rem 0 .5rem; }
h3 { font-size: 1.1rem; margin: 1rem 0 .4rem; }
h4 { font-size: 1rem; margin: .8rem 0 .3rem; }
p { margin: .4rem 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
.app-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.app-header h1 { flex: 1; margin: 0; font-size: 1.3rem; }
.hint { color: var(--muted); font-size: .9rem; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; }
.stem { font-weight: 500; margin-bottom: .75rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); margin: 12px 0;
}
.notice { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 6px; margin: 12px 0; }
.notice-info { border-left-color: var(--accent); background: var(--accent-soft); }
.error-list { color: var(--danger); margin: .5rem 0; padding-left: 1.2rem; }
.disclaimer { font-size: .9rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 24px; }

/* Tombol */
.btn {
  min-height: var(--tap); min-width: var(--tap); padding: 8px 16px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font: inherit; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-big { width: 100%; font-size: 1.15rem; min-height: 56px; letter-spacing: .03em; }
.btn-link { border: 0; background: none; color: var(--accent); padding: 8px 4px; }
.btn-icon { padding: 8px 12px; font-size: 1.2rem; line-height: 1; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Menu sekunder */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 220px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18); padding: 6px; display: grid;
}
.menu button { text-align: left; border: 0; background: none; min-height: var(--tap); padding: 8px 12px; font: inherit; color: var(--text); border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }

/* Beranda */
.package-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin: 12px 0 16px; }
.package-card {
  display: block; position: relative; border: 2px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 14px; cursor: pointer; min-height: 120px;
}
.package-card input { position: absolute; opacity: 0; pointer-events: none; }
.package-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.package-card:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.package-card .name { font-weight: 700; font-size: 1.05rem; display: block; margin-bottom: 6px; }
.package-card .meta { color: var(--muted); font-size: .92rem; display: block; }
.resume-card { border-color: var(--warn); }
select, input[type=number], input[type=text] {
  font: inherit; min-height: var(--tap); padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}

/* Formulir kustom */
.form-grid { display: grid; gap: 10px 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.field { display: grid; gap: 4px; }
.field label, .field .label { font-weight: 600; }
.section-table { width: 100%; border-collapse: collapse; }
.section-table th, .section-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.section-table input { width: 100%; max-width: 110px; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); margin-right: 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; }

/* Ruang ujian */
.exam { min-height: 100vh; display: flex; flex-direction: column; }
.exam-bar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.exam-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; padding: 0 6px; }
.timer.low { color: var(--warn); }
.exam-main { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 16px; }
.q-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.q-head .q-no { font-weight: 700; }
.q-head .q-meta { color: var(--muted); font-size: .92rem; flex: 1; }
.btn-flag[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--text); }
.exam-nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 18px; }
.saved { color: var(--muted); font-size: .88rem; text-align: center; flex: 1; }

.options { display: grid; gap: 8px; margin: 10px 0; }
.option {
  display: flex; gap: 12px; align-items: flex-start; min-height: var(--tap);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface); cursor: pointer;
}
.option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.option input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; }
.option-letter { font-weight: 700; min-width: 1.2em; }
.option-text { flex: 1; white-space: pre-wrap; }
.answer-text {
  width: 100%; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); resize: vertical; min-height: 180px;
}
.numeric-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.input-number { max-width: 220px; }
.unit { color: var(--muted); }

.case-tabs { display: flex; gap: 0; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.case-tabs button { flex: 1; min-height: var(--tap); border: 0; background: var(--surface); font: inherit; color: var(--text); cursor: pointer; }
.case-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.q-case[data-tab="case"] .answer-pane, .q-case[data-tab="answer"] .case-pane { display: none; }
.sub-question { margin-bottom: 14px; }
.sub-prompt { margin-bottom: 6px; }
.table-wrap { overflow-x: auto; margin: 10px 0; }
.data-table { border-collapse: collapse; min-width: 100%; font-size: .95rem; }
.data-table caption { text-align: left; font-weight: 600; padding-bottom: 6px; }
.data-table th, .data-table td { border: 1px solid var(--border); padding: 6px 8px; }
.data-table th { background: var(--surface-2); }
.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

@media (min-width: 900px) and (orientation: landscape) {
  .case-tabs { display: none; }
  .q-case .case-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .q-case[data-tab] .case-pane, .q-case[data-tab] .answer-pane { display: block; }
  .q-case .case-pane { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  .exam-main:has(.q-case) { max-width: 1400px; }
}

/* Daftar soal: panel bawah di ponsel, panel samping di layar lebar */
.panel-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 30; }
.panel {
  position: fixed; z-index: 31; background: var(--surface); padding: 16px;
  left: 0; right: 0; bottom: 0; max-height: 70vh; overflow: auto;
  border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0, 0, 0, .25);
}
@media (min-width: 900px) {
  .panel { left: auto; top: 0; width: 360px; max-height: none; border-radius: 0; }
}
.q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin: 12px 0; }
.q-grid button {
  min-height: var(--tap); border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
  font: inherit; font-weight: 600; color: var(--text); cursor: pointer; position: relative;
}
.q-grid button.answered { background: var(--accent-soft); border-color: var(--accent); }
.q-grid button.flagged::after { content: "⚑"; position: absolute; top: 1px; right: 4px; font-size: .75rem; color: var(--warn); }
.q-grid button.current { outline: 3px solid var(--text); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .88rem; color: var(--muted); }

.overlay {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center;
}

/* Dialog */
.dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); max-width: min(520px, 92vw); padding: 20px; }
.dialog::backdrop { background: rgba(0, 0, 0, .45); }
.dialog h2 { margin-top: 0; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.summary-grid div { background: var(--surface-2); border-radius: 8px; padding: 8px; }
.summary-grid strong { display: block; font-size: 1.4rem; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); z-index: 50;
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 10px; max-width: 92vw;
  transition: transform .2s ease;
}
.toast.show { transform: translate(-50%, 0); }

/* Hasil */
.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: .9rem; background: var(--surface-2); }
.badge-wait { background: var(--warn-soft); color: var(--text); }
.badge-pass { background: var(--ok); color: #fff; }
.badge-fail { background: var(--danger); color: #fff; }
.score-table { width: 100%; border-collapse: collapse; }
.score-table th, .score-table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
.score-table td.num, .score-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.big-score { font-size: 2.2rem; font-weight: 800; }
.history-list { display: grid; gap: 8px; }
.history-item { width: 100%; text-align: left; display: grid; gap: 2px; }

/* Self-test */
.selftest-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.selftest-table td { border-bottom: 1px solid var(--border); padding: 4px 6px; vertical-align: top; }
.pass { color: var(--ok); font-weight: 700; }
.fail { color: var(--danger); font-weight: 700; }
.skip { color: var(--muted); }

@media (max-width: 480px) {
  .exam-bar .btn { padding: 6px 10px; }
  .exam-bar .label-long { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}

/* Hasil dan laporan (A2) */
.small { font-size: .88rem; }
.btn-small { min-height: 36px; padding: 4px 12px; font-size: .92rem; }
.report-section > summary { cursor: pointer; min-height: var(--tap); display: flex; align-items: center; font-weight: 700; font-size: 1.1rem; }
.report-section > summary .summary-title { flex: 1; }
.section-body { margin-top: 8px; }
.section-body h3 { margin-top: 1.4rem; padding-top: .8rem; border-top: 1px solid var(--border); }
.prose-list { margin: .3rem 0 .8rem; padding-left: 1.3rem; white-space: pre-wrap; }
.report-table { min-width: 0; width: 100%; }
.report-table td, .report-table th { white-space: pre-wrap; overflow-wrap: anywhere; vertical-align: top; text-align: left; }
.fill-dcf2e3 { background: color-mix(in srgb, var(--ok) 18%, var(--surface)); }
.fill-fdecd3 { background: var(--warn-soft); }
.grade-status { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; }
.grade-status li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); padding: 4px 0; }
.paste-area { min-height: 140px; font-family: ui-monospace, Consolas, monospace; font-size: .9rem; }
.import-errors .error-list { overflow-wrap: anywhere; }
details > summary { cursor: pointer; }
dialog .field { margin: 10px 0; }
dialog select, dialog input[type=text] { width: 100%; }

/* Grafik tren (Riwayat) */
.trend-chart { width: 100%; height: auto; display: block; }
.trend-grid { stroke: var(--border); stroke-width: 1; }
.trend-pass { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.trend-axis { fill: var(--muted); font-size: 12px; }
.trend-value { fill: var(--text); font-size: 13px; font-weight: 700; }
.trend-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend-hit { fill: transparent; }
.trend-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.trend-dot-fail { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.trend-point { cursor: pointer; outline: none; }
.trend-point:focus-visible .trend-hit, .trend-point:hover .trend-hit { fill: var(--accent-soft); }

/* Pengelola Bank Soal (A3) */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--border); margin: 12px 0; }
.tab { min-height: var(--tap); padding: 8px 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: none; font: inherit; color: var(--text); cursor: pointer; }
.tab.active { background: var(--surface); border-color: var(--border); font-weight: 700; margin-bottom: -2px; border-bottom: 2px solid var(--surface); }
.bank-table td { vertical-align: middle; }
.bank-table input[type=checkbox] { width: 22px; height: 22px; }
.selected-row { background: var(--accent-soft); }
.warn-row td { background: var(--warn-soft); }
.status-live { background: var(--ok); color: #fff; }
.status-approved, .status-ai_reviewed { background: var(--accent-soft); color: var(--text); }
.status-needs_revision, .status-calibration { background: var(--warn-soft); color: var(--text); }
.status-rejected, .status-retired { background: var(--surface-2); color: var(--muted); }
.preview-view { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; margin: 10px 0; background: var(--bg); }
.pending-list { list-style: none; padding: 0; display: grid; gap: 10px; }
.pending-list li { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.log-list { padding-left: 1.2rem; font-size: .92rem; }
.pin-card { max-width: 420px; }

/* PWA, iOS, SEB (A4): safe-area untuk notch/home indicator, mode fokus, spanduk pembaruan */
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.screen { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(48px, calc(24px + env(safe-area-inset-bottom))); }
.exam-bar { padding-top: max(6px, env(safe-area-inset-top)); }
.exam-main { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.panel { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.toast { bottom: calc(20px + env(safe-area-inset-bottom)); }
.exam { min-height: 100vh; min-height: 100dvh; }
.exam.focus-mode .exam-title, .exam.focus-mode .q-meta, .exam.focus-mode .badge-seb { display: none; }
.exam.focus-mode .exam-main { max-width: none; padding-top: 8px; }
html.exam-focus, html.exam-focus body { overscroll-behavior: none; }
.update-banner {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 45;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  background: var(--surface); color: var(--text); border: 2px solid var(--accent); border-radius: 12px;
  padding: 10px 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); max-width: calc(100vw - 24px);
}
.install-card { border-color: var(--accent); }
.badge-seb { background: var(--ok); color: #fff; white-space: nowrap; }
@media print { .update-banner { display: none !important; } }

</style>
<style media="print">
/* Cetak / PDF (SPEC 11): laporan saja, tanpa tombol dan menu; warna terang. */
@page { size: A4; margin: 16mm 14mm; }
:root { --bg: #fff; --surface: #fff; --surface-2: #eef1f5; --text: #000; --muted: #444; --border: #999; --shadow: none; }
body { background: #fff; color: #000; font-size: 11pt; }
.no-print, .app-header button, .btn, .toast, dialog { display: none !important; }
.screen { max-width: none; padding: 0; }
.card { border: 0; box-shadow: none; padding: 0; margin: 8px 0; }
.report-section > summary { font-size: 14pt; color: #1d4ed8; break-after: avoid; }
.report-section { break-before: page; }
.report-section:first-of-type { break-before: auto; }
h2, h3, h4 { break-after: avoid; }
tr, .big-score { break-inside: avoid; }
.table-wrap { overflow: visible; }
.data-table th { background: #e7ecf3 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.badge { border: 1px solid #000; }

</style>
</head>

<main id="app">
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
<p class="screen">Memuat aplikasi…</p>
</main>
<script>
// Dibuat otomatis oleh tools/build-pack.mjs. Jangan diedit langsung.
window.CA_SIM_PACK_INDEX = ["demo","msk"];
</script>
<script>

        "$ref": "common.schema.json#/$defs/questionType"
      },
      "caseSize": {
        "$ref": "common.schema.json#/$defs/caseSize"
      },
      "topicIds": {
        "type": "array",
        "minItems": 1,
        "uniqueItems": true,
        "items": {
          "$ref": "common.schema.json#/$defs/topicId"
        }
      },
      "competencyIds": {
        "type": "array",
        "minItems": 1,
        "uniqueItems": true,
        "items": {
          "$ref": "common.schema.json#/$defs/competencyId"
        }
      },
      "difficulty": {
        "$ref": "common.schema.json#/$defs/difficulty"
      },
      "cognitiveLevel": {
        "$ref": "common.schema.json#/$defs/cognitiveLevel"
      },
      "estimatedMinutes": {
        "type": "number",
        "exclusiveMinimum": 0,
        "maximum": 240
      },
      "maxScore": {
        "$ref": "common.schema.json#/$defs/positiveScore"
      },
      "stem": {
        "$ref": "common.schema.json#/$defs/nonEmptyString"
      },
      "options": {
        "type": "array",
        "minItems": 4,
        "maxItems": 4,
        "items": {
          "$ref": "#/$defs/option"
        }
      },
      "answerKey": {
        "$ref": "common.schema.json#/$defs/optionKey"
      },
      "distractorRationale": {
        "type": "object",
        "minProperties": 3,
        "maxProperties": 3,
        "propertyNames": {
          "$ref": "common.schema.json#/$defs/optionKey"
        },
        "additionalProperties": {
          "$ref": "common.schema.json#/$defs/nonEmptyString"
        }
      },
      "numericAnswer": {
        "$ref": "#/$defs/numericAnswer"
      },
      "caseNarrative": {
        "$ref": "common.schema.json#/$defs/nonEmptyString"
      },
      "caseData": {
        "type": "array",
        "items": {
          "$ref": "#/$defs/caseTable"
        }
      },
      "subQuestions": {
        "type": "array",
        "minItems": 1,
        "maxItems": 8,
        "items": {
          "$ref": "#/$defs/subQuestion"
        }
      },
      "explanation": {
        "$ref": "common.schema.json#/$defs/nonEmptyString"
      },
      "modelAnswer": {
        "$ref": "common.schema.json#/$defs/nonEmptyString"
      },
      "rubric": {
        "$ref": "#/$defs/rubric"
      },
      "acceptableAlternatives": {
        "$ref": "common.schema.json#/$defs/nonEmptyString"
      },
      "references": {
        "type": "array",
        "items": {
          "$ref": "common.schema.json#/$defs/nonEmptyString"
        }
      },
      "lifecycle": {
        "$ref": "#/$defs/lifecycle"
      },
      "authoring": {
        "$ref": "#/$defs/authoring"
      },
      "calibration": {
        "$ref": "#/$defs/calibration"
      }
    },
    "allOf": [
      {
        "$ref": "#/$defs/typeRules"
      }
    ],
    "$defs": {
      "option": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "key",
          "text"
        ],
        "properties": {
          "key": {
            "$ref": "common.schema.json#/$defs/optionKey"
          },
          "text": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          }
        }
      },
      "numericAnswer": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "value",
          "unit",
          "tolerance"
        ],
        "properties": {
          "value": {
            "type": "number"
          },
          "unit": {
            "type": "string"
          },
          "tolerance": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "type",
              "value"
            ],
            "properties": {
              "type": {
                "enum": [
                  "absolute",
                  "relative"
                ]
              },
              "value": {
                "type": "number",
                "minimum": 0,
                "description": "absolute: selisih maksimum dalam satuan jawaban; relative: pecahan (0.01 = 1%)."
              }
            }
          }
        }
      },
      "rubricCriterion": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "criterionId",
          "description",
          "maxScore",
          "full",
          "partial",
          "zero"
        ],
        "properties": {
          "criterionId": {
            "$ref": "common.schema.json#/$defs/criterionId"
          },
          "description": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "maxScore": {
            "$ref": "common.schema.json#/$defs/positiveScore"
          },
          "full": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "partial": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "zero": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          }
        }
      },
      "rubric": {
        "type": "array",
        "minItems": 3,
        "maxItems": 6,
        "items": {
          "$ref": "#/$defs/rubricCriterion"
        }
      },
      "caseTable": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "columns",
          "rows"
        ],
        "properties": {
          "title": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "columns": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "common.schema.json#/$defs/nonEmptyString"
            }
          },
          "rows": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "array",
              "items": {
                "type": [
                  "string",
                  "number"
                ]
              }
            }
          }
        }
      },
      "subQuestion": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "prompt",
          "maxScore",
          "modelAnswer",
          "rubric"
        ],
        "properties": {
          "id": {
            "$ref": "common.schema.json#/$defs/subQuestionId"
          },
          "prompt": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "maxScore": {
            "$ref": "common.schema.json#/$defs/positiveScore"
          },
          "modelAnswer": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "rubric": {
            "$ref": "#/$defs/rubric"
          }
        }
      },
      "lifecycle": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "contentHash",
          "review",
          "approvedBy",
          "approvedAt"
        ],
        "properties": {
          "status": {
            "$ref": "common.schema.json#/$defs/lifecycleStatus"
          },
          "contentHash": {
            "type": "string",
            "pattern": "^([0-9a-f]{64})?$",
            "description": "Kosong dari AI; diisi aplikasi (SHA-256 heksadesimal huruf kecil)."
          },
          "review": {
            "anyOf": [
              {
                "type": "null"
              },
              {
                "$ref": "#/$defs/reviewRecord"
              }
            ]
          },
          "approvedBy": {
            "anyOf": [
              {
                "type": "null"
              },
              {
                "$ref": "common.schema.json#/$defs/nonEmptyString"
              }
            ]
          },
          "approvedAt": {
            "$ref": "common.schema.json#/$defs/nullableDateTime"
          },
          "history": {
            "type": "array",
            "items": {
              "$ref": "#/$defs/statusTransition"
            }
          }
        }
      },
      "statusTransition": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "from",
          "to",
          "at"
        ],
        "properties": {
          "from": {
            "$ref": "common.schema.json#/$defs/lifecycleStatus"
          },
          "to": {
            "$ref": "common.schema.json#/$defs/lifecycleStatus"
          },
          "at": {
            "$ref": "common.schema.json#/$defs/dateTime"
          },
          "by": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "reviewRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "batchId",
          "reviewerModel",
          "reviewedAt",
          "result"
        ],
        "properties": {
          "batchId": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "reviewerModel": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "reviewedAt": {
            "$ref": "common.schema.json#/$defs/dateTime"
          },
          "result": {
            "$ref": "review-result.schema.json#/$defs/reviewItem"
          }
        }
      },
      "authoring": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "createdBy",
          "createdAt",
          "revision"
        ],
        "properties": {
          "createdBy": {
            "enum": [
              "AI",
              "manusia"
            ]
          },
          "model": {
            "type": "string"
          },
          "createdAt": {
            "anyOf": [
              {
                "$ref": "common.schema.json#/$defs/date"
              },
              {
                "$ref": "common.schema.json#/$defs/dateTime"
              }
            ]
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "notes": {
            "type": "string"
          }
        },
        "if": {
          "properties": {
            "createdBy": {
              "const": "AI"
            }
          },
          "required": [
            "createdBy"
          ]
        },
        "then": {
          "required": [
            "model"
          ],
          "properties": {
            "model": {
              "minLength": 1
            }
          }
        }
      },
      "calibration": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "defectDimension",
          "defectDescription",
          "expectedVerdict"
        ],
        "properties": {
          "defectDimension": {
            "$ref": "common.schema.json#/$defs/dimensionName"
          },
          "defectDescription": {
            "$ref": "common.schema.json#/$defs/nonEmptyString"
          },
          "expectedVerdict": {
            "enum": [
              "REVISE",
              "REJECT"
            ]
          }
        }
      },
      "typeRules": {
        "$comment": "Field wajib dan terlarang per tipe soal. Dipakai juga oleh review-export.",
        "allOf": [
          {
            "if": {
              "properties": {
                "type": {
                  "const": "mcq"
                }
              },
              "required": [
                "type"
              ]
            },
            "then": {
              "required": [
                "options",
                "answerKey",
                "distractorRationale",
                "explanation"
              ],
              "properties": {
                "maxScore": {
                  "const": 1
                },
                "caseSize": false,
                "numericAnswer": false,
                "caseNarrative": false,
                "caseData": false,
                "subQuestions": false,
                "rubric": false
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "numeric"
                }
              },
              "required": [
                "type"
              ]
            },
            "then": {
              "required": [
                "numericAnswer",
                "explanation"
              ],
              "properties": {
                "maxScore": {
                  "const": 1
                },
                "caseSize": false,
                "options": false,
                "answerKey": false,
                "distractorRationale": false,
                "caseNarrative": false,
                "caseData": false,
                "subQuestions": false,
                "rubric": false
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "essay"
                }
              },
              "required": [
                "type"
              ]
            },
            "then": {
              "required": [
                "rubric",
                "modelAnswer",
                "acceptableAlternatives"
              ],
              "properties": {
                "maxScore": {
                  "const": 10
                },
                "caseSize": false,
                "options": false,
                "answerKey": false,
                "distractorRationale": false,
                "numericAnswer": false,
                "caseNarrative": false,
                "caseData": false,
                "subQuestions": false
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "case"
                }
              },
              "required": [
                "type"
              ]
            },
            "then": {
              "required": [
                "caseSize",
                "caseNarrative",
                "subQuestions",
                "acceptableAlternatives"
              ],
              "properties": {
                "maxScore": {
                  "const": 20
                },
                "options": false,
                "answerKey": false,
                "distractorRationale": false,
                "numericAnswer": false,
                "rubric": false
              }
            }
          }
        ]
      }
    }
  },

function checkCriteria(rubric, criteria, path, owner, errors) {
  const byId = new Map(rubric.map((c) => [c.criterionId, c]));
  const seen = new Set();
  criteria.forEach((c, k) => {
    const at = `${path}[${k}]`;
    const ref = byId.get(c.criterionId);
    if (!ref) {
      errors.push(err(`${at}.criterionId`, `${owner}: kriteria ${c.criterionId} tidak ada di rubrik.`));
      return;
    }
    if (seen.has(c.criterionId)) {
      errors.push(err(`${at}.criterionId`, `${owner}: kriteria ${c.criterionId} dinilai lebih dari sekali.`));

function checkAwarded(value, max, path, owner, errors) {
  if (value < 0) errors.push(err(path, `${owner}: skor tidak boleh negatif (tertulis ${fmt(value)}).`));

async function applyGradingResult(session, validation, now) {
  if (!validation.ok) throw new Error('Hasil penilaian belum valid.');
  const g = session.grading;
  g.answersChecksum = validation.result.answersChecksum;
  g.aiImports.push({ importedAt: iso(now), result: validation.result, warnings: validation.warnings });

}

// Koreksi manual satu skor kriteria (SPEC 10). Alasan wajib; dicatat dan ditandai di laporan.
// correction: { questionId, subId (null untuk esai), criterionId, after, reason }
function applyManualCorrection(session, correction, now) {
  const { questionId, criterionId } = correction;
  const subId = correction.subId ?? null;
  const ev = effectiveEvaluations(session).get(questionId);
  if (!ev) throw new Error(`Soal ${questionId} belum dinilai; koreksi manual hanya untuk skor yang sudah ada.`);
  const criterion = ev.criteria.find((c) => c.criterionId === criterionId && c.subId === subId);
  if (!criterion) throw new Error(`Kriteria ${criterionId}${subId ? ` bagian (${subId})` : ''} tidak ada pada soal ${questionId}.`);
  const after = Number(correction.after);
  if (!Number.isFinite(after) || after < 0 || after > criterion.maxScore) {
    throw new Error(`Skor baru harus antara 0 dan ${fmt(criterion.maxScore)}.`);
  }
  if (!isHalfStep(after)) throw new Error('Skor baru harus kelipatan 0,5 (mis. 2 atau 2,5).');

  if (!reason) throw new Error('Alasan koreksi wajib diisi.');
  if (after === criterion.awardedScore) throw new Error('Skor baru sama dengan skor saat ini.');
  session.grading.manualCorrections.push({
    questionId, subId, criterionId, before: criterion.awardedScore, after, reason, at: iso(now),
  });
  recomputeGrading(session);

}

        this.problems.push({ source: `sesi aktif ${active.sessionId}`, errors: active.errors });
        continue;
      }
      const { session, expired } = recoverOnOpen(active.session, Date.now());
      if (expired) {
        this.persist(session);
        if (pack.subjectId === this.subjectId) shown = session;
      }
    }
    return shown;
  }

  get pack() {
    const entry = this.packs.find((p) => p.pack.subjectId === this.subjectId);
    return entry ? entry.pack : null;
  }

  packFor(subjectId) {
    const entry = this.packs.find((p) => p.pack.subjectId === subjectId);
    return entry ? entry.pack : null;
  }

    this.current = screen;
    this.root.append(screen.el);

    if (screen.focus) screen.focus();

    if (this.pwa && this.sessionLocked !== active) {
      this.sessionLocked = active;
      this.pwa.setSessionLock(active);
    }
    const decision = updateDecision({ waiting: Boolean(this.updateWaiting), activeSession: active, screen: this.screenName });
    let banner = document.getElementById('update-banner');
    if (!decision.show || this.updateDismissed) {
      if (banner) banner.remove();
      return;
    }
    if (banner) return;
    banner = h('div', { id: 'update-banner', class: 'update-banner', role: 'status' },
      h('span', { text: 'Versi baru tersedia.' }),
      h('button', { type: 'button', class: 'btn btn-primary', onclick: () => this.applyUpdate() }, 'Muat Ulang'),
      h('button', { type: 'button', class: 'btn', onclick: () => { this.updateDismissed = true; this.syncPlatform(); } }, 'Nanti'));
    document.body.append(banner);
  }

  applyUpdate() {
    if (this.hasActiveSession()) {
      alertDialog('Ada ujian yang sedang berjalan', ['Pembaruan dipasang setelah ujian dikumpulkan.']);
      this.syncPlatform();
      return;
    }
    if (!this.pwa || !this.pwa.applyUpdate()) window.location.reload();

  // Menyimpan sesi. Hasil true bila berhasil; bila penyimpanan penuh, pengguna
  // ditawari mengunduh cadangan sesi agar jawaban tidak hilang.
  persist(session) {
    try {
      saveSession(this.store, session);
      return true;
    } catch (e) {
      const full = e instanceof StorageFullError;
      confirmDialog({
        title: full ? 'Penyimpanan penuh' : 'Gagal menyimpan',
        body: [e.message, 'Unduh cadangan sesi ini agar jawaban tidak hilang.'],
        confirmLabel: 'Unduh cadangan sesi',
        cancelLabel: 'Tutup',
      }).then((ok) => {
        if (ok) this.download(`cadangan-${session.sessionId}.json`, JSON.stringify({ backupVersion: '4.1', subjectId: session.subjectId, exportedAt: new Date().toISOString(), sessions: [session] }, null, 2));

      return false;

  }

  // Memulai sesi baru. build(rng) -> { ok, items, problems }.
  async beginSession({ packageId, packageName, mode, config, build }) {
    const pack = this.pack;
    const rng = createRng(randomSeed());
    const built = build(rng);
    if (!built.ok) {
      await alertDialog('Paket belum dapat dimulai', built.problems.map((p) => `• ${p}`));
      return;
    }
    const active = loadActiveSession(this.store, pack.subjectId);
    if (active && !active.ok) {
      const release = await confirmDialog({
        title: 'Sesi aktif tidak dapat dimuat',
        body: [
          'Ada sesi aktif yang tidak dapat dibaca aplikasi versi ini:',
          ...formatErrors(active.errors, 5),
          'Lepaskan sesi tersebut untuk memulai ujian baru. Datanya tidak dihapus: tetap tercatat di Riwayat dan ikut dalam ekspor cadangan di Pengaturan.',
        ],
        confirmLabel: 'Lepaskan & mulai baru',
      });
      if (!release) return;
      releaseActive(this.store, pack.subjectId);
    }
    if (active && active.ok) {
      const ok = await confirmDialog({
        title: 'Masih ada ujian yang belum selesai',
        body: [`Paket "${active.session.packageName}" masih berjalan.`, 'Memulai ujian baru akan MENGUMPULKAN ujian tersebut apa adanya.'],
        confirmLabel: 'Kumpulkan & mulai baru',
        danger: true,
      });
      if (!ok) return;
      submit(active.session, 'MANUAL', Date.now());
      if (!this.persist(active.session)) return;
    }
    const items = orderItems(built.items, config.shuffleQuestions, rng);
    const session = createSession({ pack, packageId, packageName, mode, config, items, rng, now: Date.now() });
    // Sesi disimpan SEBELUM timer berjalan (SPEC 9).
    if (!this.persist(session)) return;
    this.unlockAudio();
    this.show('exam', { session });
  }

  unlockAudio() {
    if (!this.settings.sound || this.audio) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) this.audio = new Ctx();
  }

  beep() {
    if (!this.settings.sound || !this.audio) return;
    const osc = this.audio.createOscillator();
    const gain = this.audio.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain).connect(this.audio.destination);
    osc.start();
    osc.stop(this.audio.currentTime + 0.35);
  }

  download(filename, data, mime = 'application/json') {
    saveFile({ filename, mime, data });
  }
}

function createStore(notices) {
  try {
    const probe = '__caSim_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return new Store(window.localStorage);
  } catch {
    notices.push('Penyimpanan perangkat tidak tersedia (mode privat?). Data hanya bertahan selama halaman terbuka.');
    return new Store(memoryBackend());
  }
}
